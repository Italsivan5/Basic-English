<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<style>
  /* Basic page look: soft background, centered column */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f1f5fb;
    color: #1f2a44;
  }
  header {
    background: #2f5fd0;
    color: #fff;
    padding: 18px 16px;
    text-align: center;
  }
  header h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; opacity: .9; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }

  /* Search box and buttons */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .controls input[type="search"] {
    flex: 1 1 220px; padding: 10px 12px; font-size: 1rem;
    border: 1px solid #b9c6e4; border-radius: 8px;
  }
  .controls button {
    padding: 10px 14px; font-size: .95rem; cursor: pointer;
    border: 1px solid #2f5fd0; background: #fff; color: #2f5fd0; border-radius: 8px;
  }
  .controls button.active { background: #2f5fd0; color: #fff; }

  /* One block per unit */
  section { margin-bottom: 26px; }
  section h2 { margin: 0 0 8px; color: #2f5fd0; border-bottom: 2px solid #c9d6f3; padding-bottom: 4px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  th { background: #e3eafa; text-align: left; padding: 8px 10px; font-size: .9rem; }
  td { padding: 8px 10px; border-top: 1px solid #e6ebf5; vertical-align: top; }
  td.word { font-weight: 700; white-space: nowrap; }
  td.def { color: #55607a; font-size: .92rem; }
  td.heb { direction: rtl; text-align: right; font-size: 1.1rem; font-weight: 600; color: #b3331f; }
  th.heb-h { text-align: right; }
  .speak { border: none; background: none; cursor: pointer; font-size: 1rem; padding: 0 4px; }

  /* "Quiz mode": Hebrew is blurred until you click it */
  body.quiz td.heb span { filter: blur(6px); cursor: pointer; transition: filter .15s; }
  body.quiz td.heb span.shown { filter: none; }

  .count { color: #55607a; font-size: .9rem; margin: 0 0 12px; }
  footer { text-align: center; color: #6b7690; font-size: .85rem; padding: 18px 8px 28px; }

  @media (max-width: 600px) {
    td.def, th.def-h { display: none; } /* hide English definition on small phones */
    td.word { white-space: normal; }
  }
  @media print { .controls { display: none; } body { background: #fff; } }
</style>
</head>
<body>

  </div>
  <p class="count" id="count"></p>

const content = document.getElementById("content");
const countLabel = document.getElementById("count");

// Builds the tables on screen. "filter" is the text typed in the search box.
function render(filter) {
  const q = filter.trim().toLowerCase();
  let shown = 0;
  let html = "";
  UNITS.forEach((unit) => {
    // Keep only the words that match the search (English, meaning, or Hebrew)
    const rows = unit.words.filter((w) => !q || w.join(" ").toLowerCase().includes(q));
    if (!rows.length) return;
    shown += rows.length;
    html += `<section><h2>${unit.title} (${rows.length})</h2><table>
      <tr><th>English</th><th class="def-h def">Meaning</th><th class="heb-h heb">עברית</th></tr>`;
    rows.forEach((w) => {
      html += `<tr>
        <td class="word">${w[0]} <button class="speak" data-say="${w[0].replace(/\(.*?\)/g, "").trim()}" title="Listen">🔊</button></td>
        <td class="def">${w[1]}</td>
        <td class="heb" dir="rtl"><span>${w[2]}</span></td>
      </tr>`;
    });
    html += `</table></section>`;
  });
  content.innerHTML = html || "<p>No words found.</p>";
  countLabel.textContent = `${shown} words`;
}

// Search box: redraw the tables every time the text changes
document.getElementById("search").addEventListener("input", (e) => render(e.target.value));

// Quiz mode button: turns the Hebrew blur on/off
const quizBtn = document.getElementById("quizBtn");
quizBtn.addEventListener("click", () => {
  document.body.classList.toggle("quiz");
  quizBtn.classList.toggle("active");
  document.querySelectorAll("td.heb span.shown").forEach((s) => s.classList.remove("shown"));
});

// Clicks inside the tables: the speaker button reads the word aloud,
// and in quiz mode clicking the Hebrew reveals it
content.addEventListener("click", (e) => {
  const say = e.target.dataset.say;
  if (say) {
    const u = new SpeechSynthesisUtterance(say);
    u.lang = "en-US";
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    return;
  }
  if (e.target.matches("td.heb span")) e.target.classList.toggle("shown");
});

render("");
</script>
